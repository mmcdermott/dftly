name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  run_tests_ubuntu:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    timeout-minutes: 30

    # Lifted out of `secrets` so the Codecov steps can gate on whether it is set: the
    # `secrets` context is not available in a step-level `if`, only `env` is.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup package
        uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: >
          uv run pytest -v
          --ignore=docs
          --cov=src
          --cov-report=xml:coverage.xml
          --cov-report=term
          --junitxml=junit.xml

      # Dependabot and fork PRs run without access to repo secrets, and Codecov rejects
      # unauthenticated uploads to a protected branch. Skip the upload in that case
      # rather than let `fail_ci_if_error` redden a run whose tests actually passed.
      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results
